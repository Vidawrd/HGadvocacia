  let currentStep = 1;
  const totalSteps = 4;
  const formData = {
    situacao: '',
    contribuicao: '',
    solicitacao: '',
    nome: ''
  };

  const steps = {
    1: {
      title: "Qual é a sua situação em relação ao filho?",
      options: [
        "Ainda estou grávida",
        "Meu filho tem até 5 anos",
        "Meu filho tem mais de 5 anos"
      ],
      key: 'situacao'
    },
    2: {
      title: "Você já contribuiu para o INSS?",
      options: [
        "Sim, já contribuí",
        "Não contribuí",
        "Não sei informar"
      ],
      key: 'contribuicao'
    },
    3: {
      title: "Já solicitou o Auxílio-Maternidade?",
      options: [
        "Sim, e foi negado",
        "Sim, ainda está em análise",
        "Não, nunca solicitei"
      ],
      key: 'solicitacao'
    },
    4: {
      title: "Qual é o seu nome?",
      type: 'input',
      placeholder: 'Seu nome completo',
      key: 'nome'
    }
  };

  function renderStep() {
    const container = document.getElementById('step-container');
    const label = document.getElementById('step-label');
    const nextBtn = document.getElementById('next-btn');
    const backBtn = document.getElementById('back-btn');
    const stepData = steps[currentStep];

    label.innerText = currentStep === 4 ? "ETAPA FINAL" : `ETAPA ${currentStep} DE 4`;
    backBtn.style.display = currentStep > 1 ? 'block' : 'none';
    nextBtn.innerText = currentStep === 4 ? "Enviar respostas ➔" : "Continuar ➔";

    let html = `<div class="step-content"><h3>${stepData.title}</h3>`;

    if (stepData.type === 'input') {
      html += `
        <div class="input-group">
          <input type="text" id="form-input" class="input-field" placeholder="${stepData.placeholder}" value="${formData[stepData.key]}" oninput="updateInputValue(this.value)">
        </div>
      `;
    } else {
      html += `<div class="option-list">`;
      stepData.options.forEach(opt => {
        const isSelected = formData[stepData.key] === opt;
        html += `
          <button class="option-btn ${isSelected ? 'selected' : ''}" onclick="selectOption('${opt}')">
            ${opt}
            <span>${isSelected ? '●' : '○'}</span>
          </button>
        `;
      });
      html += `</div>`;
    }

    html += `</div>`;
    container.innerHTML = html;
  }

  function selectOption(val) {
    formData[steps[currentStep].key] = val;
    renderStep();
    setTimeout(nextStep, 300);
  }

  function updateInputValue(val) {
    formData[steps[currentStep].key] = val;
  }

  function nextStep() {
    if (!formData[steps[currentStep].key]) {
      alert("Por favor, selecione uma opção ou preencha o campo.");
      return;
    }

    if (currentStep < totalSteps) {
      currentStep++;
      renderStep();
    } else {
      finishForm();
    }
  }

  function prevStep() {
    if (currentStep > 1) {
      currentStep--;
      renderStep();
    }
  }

  function finishForm() {
    const texto = `Olá! Realizei a consulta no site da HG Advocacia.\n\n*Nome:* ${formData.nome}\n*Situação:* ${formData.situacao}\n*Contribuição:* ${formData.contribuicao}\n*Já solicitou:* ${formData.solicitacao}`;
    window.open(`https://wa.me/556993969597?text=${encodeURIComponent(texto)}`, '_blank');
  }

  renderStep();
</script>
